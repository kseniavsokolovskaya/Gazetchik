name: Газета

on:
  # Главный запуск — будильник cron-job.org в 9:50 по Киеву (через workflow_dispatch).
  # Это запасной: если будильник не сработал, GitHub сам соберёт газету около 10:20–10:40.
  # Если газета уже отправлена сегодня, запасной запуск ничего не делает.
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gazeta
  cancel-in-progress: false

jobs:
  gazeta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Собрать и отправить газету
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "370560008"
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
          LUNO_URL: ${{ secrets.LUNO_URL }}
          LUNO_ANON_KEY: ${{ secrets.LUNO_ANON_KEY }}
          LUNO_SECRET: ${{ secrets.LUNO_SECRET }}
        run: python gazeta.py
      - name: Сохранить страницу
        run: |
          git config user.name "gazeta-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "Выпуск $(TZ=Europe/Kyiv date +%F)" || echo "без изменений"
          git push
